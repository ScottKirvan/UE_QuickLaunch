name: Release Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json

  improve-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-release-notes.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "UE QuickLaunch"
      project_context: "UE QuickLaunch is a launcher tool for Unreal Engine developers that makes it faster to open and switch between Unreal projects. Write changes in terms of how they speed up or simplify the project-opening workflow for developers."
      header: |
        ## UE QuickLaunch

        > Quick launcher for Unreal Engine projects.

        🫶❤️[Support this project](https://ko-fi.com/ScottKirvan) · 📖 [User Guide](https://www.scottkirvan.com/UE_QuickLaunch/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report an Issue](https://github.com/ScottKirvan/UE_QuickLaunch/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/ScottKirvan/UE_QuickLaunch/issues/new?template=feature_request.md) · 📋 [Changelog](https://github.com/ScottKirvan/UE_QuickLaunch/blob/main/notes/CHANGELOG.md)

        ---
      footer: ""
      changelog_path: ""
    secrets: inherit

  update-changelog-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-update-changelog-prs.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  discord-notify:
    needs: [release-please, improve-release-notes]
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ScottKirvan/.github/.github/workflows/reusable-discord-notify.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      project_name: "UE QuickLaunch"
      emoji: "🚀"
      discord_blurb: ${{ needs.improve-release-notes.outputs.discord_blurb }}
    secrets: inherit
